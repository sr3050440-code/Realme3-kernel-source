name: Realme 3i Kernel 4.14.186 Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Realme 3i Kernel
    runs-on: ubuntu-20.04

    steps:
      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ----------------------------------------------------------
      # 2. Dependencies
      # ----------------------------------------------------------
      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            libgnutls28-dev \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

          echo "Dependencies installed"

      # ----------------------------------------------------------
      # 3. Python 2
      # ----------------------------------------------------------
      - name: Setup Python 2
        shell: bash
        run: |
          if ! command -v python2 >/dev/null 2>&1; then
            wget -q https://bootstrap.pypa.io/pip/2.7/get-pip.py -O /tmp/get-pip.py
            sudo apt-get install -y python2-minimal || true
          fi

          if command -v python2 >/dev/null 2>&1; then
            python2 --version
          else
            echo "Python 2 is not available from apt"
          fi

      # ----------------------------------------------------------
      # 4. GCC 4.9 Toolchains
      # ----------------------------------------------------------
      - name: Download Android GCC 4.9
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          git clone --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc64"

          git clone --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc32"

          test -x "$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-gcc"
          test -x "$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-gcc"

          "$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-gcc" --version
          "$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-gcc" --version

      # ----------------------------------------------------------
      # 5. Kernel version
      # ----------------------------------------------------------
      - name: Check Kernel Source
        shell: bash
        run: |
          echo "Kernel Makefile:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile

          echo ""
          echo "Searching defconfig..."

          find arch -type f \
            \( -name '*oppo6771*' -o -name '*18601*' \) \
            | sort || true

      # ----------------------------------------------------------
      # 6. Patch kernel to 4.14.186
      # ----------------------------------------------------------
      - name: Apply Linux 4.14.186 Patch
        shell: bash
        run: |
          set -e

          CURRENT_SUBLEVEL=$(grep '^SUBLEVEL' Makefile | awk '{print $3}')

          echo "Current kernel sublevel: $CURRENT_SUBLEVEL"

          if [ "$CURRENT_SUBLEVEL" = "186" ]; then
            echo "Kernel is already 4.14.186"
            exit 0
          fi

          if [ "$CURRENT_SUBLEVEL" != "146" ]; then
            echo "Expected 4.14.146 source."
            echo "Found:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile
            exit 1
          fi

          wget -q \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/patch-4.14.186.xz

          unxz patch-4.14.186.xz

          patch -p1 \
            --forward \
            --exclude=Makefile \
            < patch-4.14.186

          sed -i \
            's/^SUBLEVEL = 146$/SUBLEVEL = 186/' \
            Makefile

          echo ""
          echo "Final kernel version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile

      # ----------------------------------------------------------
      # 7. Find defconfig
      # ----------------------------------------------------------
      - name: Verify Defconfig
        shell: bash
        run: |
          set -e

          CONFIG="arch/arm64/configs/oppo6771_18601_defconfig"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG not found!"
            echo ""
            echo "Available oppo/6771 configs:"
            find arch/arm64/configs -type f \
              \( -iname '*oppo*' -o -iname '*6771*' \) \
              | sort

            exit 1
          fi

          echo "Found:"
          ls -lh "$CONFIG"

      # ----------------------------------------------------------
      # 8. Configure
      # ----------------------------------------------------------
      - name: Configure Kernel
        shell: bash
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -o pipefail

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "Running defconfig"
          echo "=========================================="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            oppo6771_18601_defconfig \
            2>&1 | tee defconfig.log

          echo ""
          echo "=========================================="
          echo "Checking generated config"
          echo "=========================================="

          test -f out/.config

          echo "CONFIG generated successfully"

          cp out/.config config-used

      # ----------------------------------------------------------
      # 9. Kernel compatibility fixes
      # ----------------------------------------------------------
      - name: Apply Kernel Build Fixes
        shell: bash
        run: |
          set -e

          echo "Applying compatibility fixes..."

          # Old DTC lexer
          if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
            sed -i \
              's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-lexer.lex.c_shipped
          fi

          # Old host compiler compatibility
          export KCFLAGS="-Wno-error"
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          # Disable problematic OPPO fingerprint driver
          if grep -q '^CONFIG_OPPO_FINGERPRINT=y' out/.config; then
            sed -i \
              's/^CONFIG_OPPO_FINGERPRINT=y/# CONFIG_OPPO_FINGERPRINT is not set/' \
              out/.config
          fi

          echo "Fixes applied"

      # ----------------------------------------------------------
      # 10. Build kernel
      # ----------------------------------------------------------
      - name: Build Kernel
        shell: bash
        env:
          ARCH: arm64
          SUBARCH: arm64
          KCFLAGS: -Wno-error
          HOSTCFLAGS: -fcommon
          HOSTCXXFLAGS: -fcommon
        run: |
          set -o pipefail

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          echo "=========================================="
          echo "BUILDING KERNEL"
          echo "=========================================="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            KCFLAGS="$KCFLAGS" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            2>&1 | tee build.log

      # ----------------------------------------------------------
      # 11. Check output
      # ----------------------------------------------------------
      - name: Check Kernel Output
        shell: bash
        run: |
          set -e

          echo "Kernel output:"
          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            | sort

          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "ERROR: Image.gz not generated"
            exit 1
          fi

          echo "Image.gz generated successfully"

      # ----------------------------------------------------------
      # 12. Generate Image.gz-dtb
      # ----------------------------------------------------------
      - name: Generate Image.gz-dtb
        shell: bash
        run: |
          set -e

          DTB=$(find out/arch/arm64/boot/dts \
            -type f \
            -name '*.dtb' \
            | head -n 1)

          if [ -z "$DTB" ]; then
            echo "No DTB found"
            exit 1
          fi

          echo "Using DTB:"
          echo "$DTB"

          cat \
            out/arch/arm64/boot/Image.gz \
            "$DTB" \
            > out/arch/arm64/boot/Image.gz-dtb

          ls -lh out/arch/arm64/boot/Image.gz*
          
      # ----------------------------------------------------------
      # 13. Package
      # ----------------------------------------------------------
      - name: Package Kernel
        shell: bash
        run: |
          set -e

          rm -rf kernel-output
          mkdir -p kernel-output

          cp out/arch/arm64/boot/Image.gz-dtb \
            kernel-output/

          cp out/arch/arm64/boot/Image.gz \
            kernel-output/

          cp out/.config \
            kernel-output/config

          cp defconfig.log \
            kernel-output/

          cp build.log \
            kernel-output/

          cd kernel-output

          zip -9 -r \
            ../Realme3i-Kernel-4.14.186.zip \
            .

      # ----------------------------------------------------------
      # 14. Upload artifact
      # ----------------------------------------------------------
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-Kernel-4.14.186
          path: Realme3i-Kernel-4.14.186.zip
          if-no-files-found: error
