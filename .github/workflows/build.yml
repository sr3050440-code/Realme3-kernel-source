name: Realme 3i Kernel 4.14.186 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: sr3050440-code/Realme3-kernel-source
          ref: master
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install Build Dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libssl-dev libncurses5-dev \
            libncurses-dev libelf-dev libgnutls28-dev clang lld llvm \
            git zip unzip cpio rsync python2.7 python2.7-minimal xz-utils patch python3

          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2

      # ============================================================
      # 3. UPSTREAM KERNEL TO 4.14.186
      # ============================================================
      - name: Upstream Patch to 4.14.186
        shell: bash
        run: |
          echo "============================================"
          echo "UPGRADING KERNEL VERSION TO 4.14.186"
          echo "============================================"

          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/patch-4.14.186.xz
          xz -d patch-4.14.186.xz

          patch -p1 --forward --reject-file=- --exclude="Makefile" < patch-4.14.186 || true

          sed -i 's/SUBLEVEL = 146/SUBLEVEL = 186/g' Makefile

          echo "Kernel Source version upgraded!"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile

      # ============================================================
      # 4. DOWNLOAD ANDROID GCC 4.9 TOOLCHAINS
      # ============================================================
      - name: Download Android 10 GCC 4.9 Toolchains
        shell: bash
        run: |
          rm -rf toolchains
          mkdir -p toolchains/gcc64 toolchains/gcc32

          git clone --depth=1 --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64

          git clone --depth=1 --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchains/gcc32

      # ============================================================
      # 5. CONFIGURE KERNEL (oppo6771_18601_defconfig)
      # ============================================================
      - name: Configure Kernel (oppo6771_18601_defconfig)
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PYTHON=python2.7
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          rm -rf out

          make O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            oppo6771_18601_defconfig

      # ============================================================
      # 6. COMPILE KERNEL
      # ============================================================
      - name: Compile Kernel
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PYTHON=python2.7
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          # MediaTek DTS Python Syntax Fix
          find . -name "DtsGen.py" -exec sed -i 's/print "\(.*\)"/print("\1")/g' {} +
          find . -name "DtsGen.py" -exec sed -i 's/print ""/print()/g' {} +
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python

          # Fix 'multiple definition of yylloc' for GCC 10/11/12
          if [ -f "scripts/dtc/dtc-lexer.lex.c_shipped" ]; then
            sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped
          fi

          # Fix Qualcomm SMEM header issue
          find drivers/ -type f -name "*.c" -exec sed -i 's/#include <soc\/qcom\/smem\.h>/\/\/ #include <soc\/qcom\/smem\.h>/g' {} +
          find drivers/ -type f -name "*.h" -exec sed -i 's/#include <soc\/qcom\/smem\.h>/\/\/ #include <soc\/qcom\/smem\.h>/g' {} +

          # Robust OPPO Fingerprint Macro Fix via Python
          python3 -c '
          import os
          target_dir = "drivers/input/oppo_fp_drivers"
          patch = "#ifndef CONFIG_OPPO_FINGERPRINT_PROJECT\n#define CONFIG_OPPO_FINGERPRINT_PROJECT 0\n#endif\n"
          if os.path.exists(target_dir):
              for root, _, files in os.walk(target_dir):
                  for file in files:
                      if file.endswith((".c", ".h")):
                          filepath = os.path.join(root, file)
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                          if "CONFIG_OPPO_FINGERPRINT_PROJECT" in content and "#define CONFIG_OPPO_FINGERPRINT_PROJECT" not in content:
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.write(patch + content)
          '

          make -j"$(nproc)" \
            O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            PYTHON="$PYTHON" \
            KCFLAGS="-DCONFIG_OPPO_FINGERPRINT_PROJECT=0" \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            2>&1 | tee build.log

      # ============================================================
      # 7. FORCE MERGE DTB
      # ============================================================
      - name: Generate Safe Image.gz-dtb
        shell: bash
        run: |
          echo "========================================"
          echo "CHECKING KERNEL IMAGE AND DTB"
          echo "========================================"

          DTB_FILE=$(find out/arch/arm64/boot/dts/ -name "*.dtb" | head -n 1)

          if [ -f "out/arch/arm64/boot/Image.gz" ] && [ -n "$DTB_FILE" ]; then
            echo "Merging Image.gz with DTB: $DTB_FILE"
            cat out/arch/arm64/boot/Image.gz $DTB_FILE > out/arch/arm64/boot/Image.gz-dtb
            echo "SUCCESS: Image.gz-dtb created!"
          fi

      # ============================================================
      # 8. COLLECT & ZIP ARTIFACTS
      # ============================================================
      - name: Package Output
        shell: bash
        run: |
          rm -rf kernel-output
          mkdir -p kernel-output

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb kernel-output/
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz kernel-output/
          fi

          cp build.log kernel-output/ || true

          cd kernel-output
          zip -9 -r ../Realme3i-Kernel-4.14.186.zip .

      # ============================================================
      # 9. UPLOAD TO GITHUB ACTIONS
      # ============================================================
      - name: Upload Kernel Zip
        uses: assets/upload-artifact@v4
        with:
          name: Realme3i-Kernel-4.14.186
          path: Realme3i-Kernel-4.14.186.zip
