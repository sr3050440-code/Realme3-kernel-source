name: Realme 3i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            libgnutls28-dev \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            python3 \
            file


      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: Show Build Environment
        run: |
          echo "=========================================="
          echo "Ubuntu"
          echo "=========================================="
          lsb_release -a || true

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h


      # ============================================================
      # UPSTREAM KERNEL TO 4.14.186
      # ============================================================

      - name: Upstream Patch to 4.14.186
        shell: bash
        run: |
          echo "============================================"
          echo "UPGRADING KERNEL VERSION TO 4.14.186"
          echo "============================================"

          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/patch-4.14.186.xz
          xz -d patch-4.14.186.xz

          patch -p1 --forward --reject-file=- --exclude="Makefile" < patch-4.14.186 || true

          sed -i 's/SUBLEVEL = 146/SUBLEVEL = 186/g' Makefile

          echo "Kernel Source version upgraded!"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile


      # ============================================================
      # GCC 4.9 AARCH64
      # ============================================================

      - name: Download AArch64 GCC 4.9
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc64"

          test -x \
            "$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-gcc"

          "$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-gcc" \
            --version


      # ============================================================
      # GCC 4.9 ARM32
      # ============================================================

      - name: Download ARM32 GCC 4.9
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc32"

          test -x \
            "$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-gcc"

          "$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-gcc" \
            --version


      # ============================================================
      # TOOLCHAIN VARIABLES
      # ============================================================

      - name: Setup Toolchain
        run: |
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"

          echo "HOSTCFLAGS=-fcommon" >> "$GITHUB_ENV"
          echo "HOSTCXXFLAGS=-fcommon" >> "$GITHUB_ENV"
          echo "KCFLAGS=-Wno-error" >> "$GITHUB_ENV"


      # ============================================================
      # CHECK KERNEL VERSION
      # ============================================================

      - name: Check Kernel Version
        run: |
          echo "=========================================="
          echo "Kernel Version"
          echo "=========================================="

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile

          echo ""
          make --version | head -n 1


      # ============================================================
      # FIND DEFCONFIG
      # ============================================================

      - name: Find Defconfig
        run: |
          echo "Searching for oppo6771 / 18601 defconfig..."

          find arch/arm64/configs \
            -type f \
            \( \
              -iname '*oppo*' \
              -o \
              -iname '*6771*' \
              -o \
              -iname '*18601*' \
            \) \
            | sort


      # ============================================================
      # VERIFY DEFCONFIG
      # ============================================================

      - name: Verify Defconfig
        run: |
          set -e

          CONFIG="arch/arm64/configs/oppo6771_18601_defconfig"

          if [ ! -f "$CONFIG" ]; then
            echo ""
            echo "ERROR: Defconfig not found:"
            echo "$CONFIG"
            echo ""

            find arch/arm64/configs \
              -type f \
              | sort

            exit 1
          fi

          echo "Defconfig found:"
          ls -lh "$CONFIG"


      # ============================================================
      # CREATE OUTPUT DIRECTORY
      # ============================================================

      - name: Prepare Build Directory
        run: |
          rm -rf out
          mkdir -p out

          echo "Output directory:"
          pwd
          ls -la


      # ============================================================
      # DEFCONFIG
      # ============================================================

      - name: Configure Kernel
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "CONFIGURING KERNEL"
          echo "=========================================="

          # Smart Fix: Remove 'hq' reference from Makefile so compiling ignores it safely
          TOUCH_MAKEFILE="drivers/input/touchscreen/mediatek/Makefile"
          if [ -f "$TOUCH_MAKEFILE" ]; then
            sed -i '/hq/d' "$TOUCH_MAKEFILE" || true
          fi

          # Disable -Werror globally in makefiles
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g' || true

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            KCFLAGS="$KCFLAGS" \
            oppo6771_18601_defconfig \
            2>&1 | tee defconfig.log

          echo ""
          echo "=========================================="
          echo "CONFIG CHECK"
          echo "=========================================="

          if [ ! -f out/.config ]; then
            echo "ERROR: .config was not generated"
            exit 1
          fi

          echo ".config generated successfully"

          cp out/.config config-used


      # ============================================================
      # KERNEL BUILD FIXES
      # ============================================================

      - name: Apply Compatibility Fixes
        shell: bash
        run: |
          set -e

          echo "Applying old-kernel compatibility fixes..."

          # --------------------------------------------------------
          # DTC lexer compatibility
          # --------------------------------------------------------

          if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
            sed -i \
              's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-lexer.lex.c_shipped || true
          fi


          # --------------------------------------------------------
          # Host compiler compatibility
          # --------------------------------------------------------

          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"


          # --------------------------------------------------------
          # Disable warnings-as-errors
          # --------------------------------------------------------

          sed -i \
            's/-Werror//g' \
            Makefile \
            scripts/Makefile* \
            2>/dev/null || true


          echo "Compatibility fixes completed."


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "BUILDING KERNEL"
          echo "=========================================="

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTCXXFLAGS="$HOSTCXXFLAGS" \
            KCFLAGS="$KCFLAGS" \
            2>&1 | tee build.log


      # ============================================================
      # CHECK BUILD OUTPUT
      # ============================================================

      - name: Check Kernel Output
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 4 \
            -type f \
            -exec ls -lh {} \;


          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo ""
            echo "ERROR: Image.gz was not generated."
            exit 1
          fi

          echo ""
          echo "Image.gz generated successfully."


      # ============================================================
      # DTB SEARCH
      # ============================================================

      - name: Find DTB
        shell: bash
        run: |
          echo "=========================================="
          echo "DTB FILES"
          echo "=========================================="

          find out/arch/arm64/boot/dts \
            -type f \
            -name '*.dtb' \
            -exec ls -lh {} \; \
            || true


      # ============================================================
      # GENERATE IMAGE.GZ-DTB
      # ============================================================

      - name: Generate Image.gz-dtb
        shell: bash
        run: |
          set -e

          IMAGE="out/arch/arm64/boot/Image.gz"

          DTB=$(find out/arch/arm64/boot/dts \
            -type f \
            -name '*.dtb' \
            | head -n 1)

          if [ -z "$DTB" ]; then
            echo "No DTB found."

            echo ""
            echo "Available boot files:"
            find out/arch/arm64/boot \
              -type f \
              | sort

            exit 1
          fi

          echo "Image:"
          echo "$IMAGE"

          echo ""
          echo "DTB:"
          echo "$DTB"

          cat \
            "$IMAGE" \
            "$DTB" \
            > out/arch/arm64/boot/Image.gz-dtb

          echo ""
          echo "Generated:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb


      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Kernel
        shell: bash
        run: |
          set -e

          rm -rf kernel-output
          mkdir -p kernel-output

          cp out/arch/arm64/boot/Image.gz \
            kernel-output/

          cp out/arch/arm64/boot/Image.gz-dtb \
            kernel-output/

          cp out/.config \
            kernel-output/config

          cp defconfig.log \
            kernel-output/

          cp build.log \
            kernel-output/


          echo "=========================================="
          echo "PACKAGING"
          echo "=========================================="

          cd kernel-output

          zip -9 -r \
            ../Realme3-Kernel.zip \
            .


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realme3-Kernel
          path: Realme3-Kernel.zip
          if-no-files-found: error


      # ============================================================
      # UPLOAD LOGS
      # ============================================================

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3-Build-Logs
          path: |
            defconfig.log
            build.log
            config-used
          if-no-files-found: ignore
