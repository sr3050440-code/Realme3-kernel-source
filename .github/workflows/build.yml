name: Realme 3i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev libncurses-dev libgnutls28-dev rsync unzip wget xz-utils zip python3 file

      - name: Upstream Patch to 4.14.186
        shell: bash
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/patch-4.14.186.xz
          xz -d patch-4.14.186.xz
          patch -p1 --forward --reject-file=- --exclude="Makefile" < patch-4.14.186 || true
          sed -i 's/SUBLEVEL = 146/SUBLEVEL = 186/g' Makefile

      - name: Download AArch64 GCC 4.9
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          git clone --depth=1 --branch android10-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 "$GITHUB_WORKSPACE/toolchains/gcc64"

      - name: Download ARM32 GCC 4.9
        run: |
          set -e
          git clone --depth=1 --branch android10-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 "$GITHUB_WORKSPACE/toolchains/gcc32"

      - name: Setup Toolchain & Python Wrapper
        run: |
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"
          echo "HOSTCFLAGS=-fcommon" >> "$GITHUB_ENV"
          echo "HOSTCXXFLAGS=-fcommon" >> "$GITHUB_ENV"
          echo "KCFLAGS=-Wno-error" >> "$GITHUB_ENV"

          # Create a smart python wrapper that auto-fixes print syntax on any executed script
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat << 'EOF' > "$GITHUB_WORKSPACE/bin/python"
          #!/usr/bin/env python3
          import sys, re, os

          if len(sys.argv) > 1 and sys.argv[1].endswith('.py'):
              script_path = sys.argv[1]
              try:
                  with open(script_path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  fixed = re.sub(r'\bprint\s+([^\(\n]+)', r'print(\1)', content)
                  if fixed != content:
                      with open(script_path, 'w', encoding='utf-8') as f:
                          f.write(fixed)
              except Exception:
                  pass

          os.execvp('python3', ['python3'] + sys.argv[1:])
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/python"
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Find Defconfig
        run: |
          find arch/arm64/configs -type f \( -iname '*oppo*' -o -iname '*6771*' -o -iname '*18601*' \) | sort

      - name: Prepare Build Directory
        run: |
          rm -rf out
          mkdir -p out

      - name: Configure Kernel
        shell: bash
        run: |
          set -o pipefail
          TOUCH_MAKEFILE="drivers/input/touchscreen/mediatek/Makefile"
          if [ -f "$TOUCH_MAKEFILE" ]; then
            sed -i '/hq/d' "$TOUCH_MAKEFILE" || true
          fi
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g' || true
          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" HOSTCFLAGS="$HOSTCFLAGS" HOSTCXXFLAGS="$HOSTCXXFLAGS" KCFLAGS="$KCFLAGS" oppo6771_18601_defconfig 2>&1 | tee defconfig.log

      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" HOSTCFLAGS="$HOSTCFLAGS" HOSTCXXFLAGS="$HOSTCXXFLAGS" KCFLAGS="$KCFLAGS" 2>&1 | tee build.log

      - name: Generate Image.gz-dtb
        shell: bash
        run: |
          set -e
          IMAGE="out/arch/arm64/boot/Image.gz"
          DTB=$(find out/arch/arm64/boot/dts -type f -name '*.dtb' | head -n 1)
          cat "$IMAGE" "$DTB" > out/arch/arm64/boot/Image.gz-dtb

      - name: Package Kernel
        shell: bash
        run: |
          set -e
          rm -rf kernel-output
          mkdir -p kernel-output
          cp out/arch/arm64/boot/Image.gz kernel-output/
          cp out/arch/arm64/boot/Image.gz-dtb kernel-output/
          cd kernel-output
          zip -9 -r ../Realme3-Kernel.zip .

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realme3-Kernel
          path: Realme3-Kernel.zip
          if-no-files-found: error
